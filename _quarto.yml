project:
  type: website
  resources:
    - files/

website:
  title: "Stephen Kirchner"                     # navbar brand -> index.qmd (About me)
  site-url: "https://stephenkirchner.github.io" # required for the RSS feed
  description: "Economist: articles, monographs and blog."
  navbar:
    left:
      - text: "Articles"
        href: articles.qmd
      - text: "Monographs"
        href: monographs.qmd
      - text: "Reviews"
        href: reviews.qmd
      - text: "Blog"
        href: blog.qmd
  sidebar:
    style: floating
    # logo: images/profile.jpg                  # uncomment once you add your photo
    contents:
      - text: "Newsletter"
        icon: envelope
        href: https://stephenkirchner.substack.com
      - text: "Twitter"
        icon: twitter-x
        href: https://x.com/insteconomics
      - text: "Bluesky"
        icon: bluesky
        href: https://bsky.app/profile/insteconomics.bsky.social
      - text: "LinkedIn"
        icon: linkedin
        href: https://www.linkedin.com/in/stephen-kirchner-6533994a
      - text: "RSS"
        icon: rss
        href: blog.xml

format:
  html:
    theme:
      light: cosmo
      dark: darkly      # two themes = dark-mode toggle in the navbar
    css: styles.css
    toc: true

execute:
  freeze: auto
