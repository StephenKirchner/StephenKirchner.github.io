# Monographs listed on monographs.qmd, sorted automatically by date (newest first).
# To add one, copy an entry. Fields:
#   title, outlet (the publisher), date (YYYY-MM-DD) and type are required.
#   type     monograph (title shown in italics) or chapter (title in quotes,
#            followed by "in <book>")
#   details  series and number, e.g. "Policy Monograph 132"
#   when     replaces the displayed date, e.g. "November 2012"
#   url      link to the publication (or a PDF in files/monographs/)
#   note     text shown at the end; may contain links
#   book, editors, book-url   for chapters: the book, its editors and a link

